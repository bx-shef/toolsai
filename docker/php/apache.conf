<Directory /var/www/html>
	AllowOverride All
	Options -Indexes +FollowSymLinks
	Require all granted
</Directory>

# Как nginx в поставке BitrixVM: служебные каталоги ядра браузеру закрыты.
<LocationMatch "^/bitrix/(modules|local_cache|stack_cache|managed_cache|php_interface)">
	Require all denied
</LocationMatch>
